<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Joseph's Home — Golf Tournament Banner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Inter:wght@400;500&display=swap');

  :root{
    --navy:#1F2C3C;
    --teal:#2A82A0;
    --sky:#D8F6FD;
    --paper:#FFFFFF;
    --wash:#F4FAFC;
    --slate:#5C6B7A;
  }

  html,body{
    margin:0;
    padding:0;
    background:var(--wash);
    font-family:'Inter',sans-serif;
  }

  /* preview page chrome, not part of the embeddable banner */
  .page-preview{
    padding:64px 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:24px;
  }
  .preview-label{
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--slate);
  }

  /* ===== the embeddable banner ===== */
  .jh-golf-banner{
    width:100%;
    max-width:960px;
    background:var(--navy);
    border-radius:10px;
    overflow:hidden;
    position:relative;
    box-shadow:0 8px 24px rgba(31,44,60,0.18);
  }
  .jh-golf-banner__rule{
    height:3px;
    width:100%;
    background:linear-gradient(90deg, var(--teal), var(--sky), var(--teal));
    background-size:200% 100%;
    animation:jh-shimmer 6s linear infinite;
  }
  @keyframes jh-shimmer{
    0%{background-position:0% 0;}
    100%{background-position:200% 0;}
  }

  .jh-golf-banner__inner{
    display:flex;
    align-items:center;
    gap:20px;
    padding:14px 22px;
    position:relative;
  }

  .jh-golf-banner__icon{
    flex:0 0 auto;
    width:40px;
    height:40px;
    position:relative;
  }
  .jh-flag{
    position:absolute;
    inset:0;
  }
  .jh-ball{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--sky);
    bottom:4px;
    left:2px;
    animation:jh-roll 3.2s ease-in-out infinite;
  }
  @keyframes jh-roll{
    0%{ transform:translateX(0) scale(1); }
    45%{ transform:translateX(20px) scale(0.85); }
    50%{ transform:translateX(20px) scale(0.7); opacity:0.6; }
    51%{ transform:translateX(0) scale(0.7); opacity:0; }
    52%{ transform:translateX(0) scale(1); opacity:1; }
    100%{ transform:translateX(0) scale(1); }
  }

  .jh-golf-banner__text{
    flex:1 1 auto;
    min-width:0;
  }
  .jh-golf-banner__eyebrow{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:11px;
    letter-spacing:.10em;
    text-transform:uppercase;
    color:var(--sky);
    opacity:0.85;
    margin:0 0 2px;
  }
  .jh-golf-banner__headline{
    font-family:'Montserrat',sans-serif;
    font-weight:800;
    font-size:17px;
    color:var(--paper);
    margin:0;
    line-height:1.3;
  }
  .jh-golf-banner__headline span{
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:13px;
    color:var(--sky);
    margin-left:8px;
  }

  .jh-golf-banner__cta{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--teal);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:14px;
    text-decoration:none;
    padding:9px 16px;
    border-radius:999px;
    white-space:nowrap;
    transition:background 0.15s ease, transform 0.15s ease;
  }
  .jh-golf-banner__cta:hover{
    background:#256f8a;
    transform:translateY(-1px);
  }
  .jh-golf-banner__cta:focus-visible{
    outline:2px solid var(--sky);
    outline-offset:2px;
  }
  .jh-golf-banner__cta svg{
    width:14px;
    height:14px;
    flex:0 0 auto;
  }

  .jh-golf-banner__close{
    flex:0 0 auto;
    background:none;
    border:none;
    color:var(--sky);
    opacity:0.6;
    cursor:pointer;
    font-size:18px;
    line-height:1;
    padding:4px;
  }
  .jh-golf-banner__close:hover{ opacity:1; }

  @media (max-width:640px){
    .jh-golf-banner__inner{
      flex-wrap:wrap;
      gap:10px 14px;
    }
    .jh-golf-banner__headline span{
      display:block;
      margin-left:0;
      margin-top:2px;
    }
    .jh-golf-banner__cta{
      order:3;
      width:100%;
      justify-content:center;
    }
    .jh-golf-banner__close{
      position:absolute;
      top:10px;
      right:10px;
    }
  }

  @media (prefers-reduced-motion: reduce){
    .jh-golf-banner__rule{ animation:none; }
    .jh-ball{ animation:none; }
  }
</style>
</head>
<body>

<div class="page-preview">
  <span class="preview-label">Preview — the code block below is what gets embedded</span>

  <div class="jh-golf-banner" role="region" aria-label="Golf tournament announcement">
    <div class="jh-golf-banner__rule"></div>
    <div class="jh-golf-banner__inner">

      <div class="jh-golf-banner__icon" aria-hidden="true">
        <svg class="jh-flag" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="10" y1="6" x2="10" y2="34" stroke="#D8F6FD" stroke-width="2" stroke-linecap="round"/>
          <path d="M10 7 L26 12 L10 17 Z" fill="#2A82A0"/>
          <ellipse cx="10" cy="35" rx="9" ry="2.4" fill="#2A82A0" opacity="0.35"/>
        </svg>
        <div class="jh-ball"></div>
      </div>

      <div class="jh-golf-banner__text">
        <p class="jh-golf-banner__eyebrow">Now open · Save the date</p>
        <p class="jh-golf-banner__headline">
          11th Annual Joseph's Home Golf Tournament
          <span>Sat, Nov 7, 2026 · Grand Bear Golf Course</span>
        </p>
      </div>

      <a class="jh-golf-banner__cta" href="https://charitygolftoday.com/josephshomegolftournament" target="_blank" rel="noopener">
        Register
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <button class="jh-golf-banner__close" aria-label="Dismiss announcement" onclick="this.closest('.jh-golf-banner').style.display='none'">×</button>
    </div>
  </div>
</div>

</body>
</html>
